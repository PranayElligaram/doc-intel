services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: "${DOCINTEL_POSTGRES_PASSWORD:?missing password}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - docintel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOCINTEL_DB_HOST: db
      DOCINTEL_DB_PORT: "5432"
      DOCINTEL_DB_NAME: docintel
      DOCINTEL_DB_USER: docintel
      DOCINTEL_POSTGRES_PASSWORD: "${DOCINTEL_POSTGRES_PASSWORD:?missing password}"
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  docintel_pgdata:
