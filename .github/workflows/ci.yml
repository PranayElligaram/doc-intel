name: ci

on:
  push:
  pull_request:

# A push that supersedes an in-flight run cancels it rather than letting both
# finish. Keyed on the ref, so branches never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,app]"

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy docintel scripts tests eval

      - name: Pytest
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build app image
        run: |
          docker build --target test -t docintel-test:ci .
          docker run --rm docintel-test:ci
          docker build --target app -t docintel-app:ci .
